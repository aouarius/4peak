name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # Immer derselbe Debug-Schlüssel, damit neue Versionen sich über die alte installieren lassen
      # und Handy- und Uhr-App dieselbe Signatur haben.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trainingskompass-debug-keystore
      - name: Handy- und Uhr-App bauen
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Dateien umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/trainingskompass-handy.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk out/trainingskompass-uhr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: trainingskompass-apks
          path: out/*.apk
