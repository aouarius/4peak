<style>
/* Layout: Trainingsbuch mit Reiter oben, Inhalt in einer Spalte; Farben der Einheiten nach dem Hantelscheiben-Code (rot 25, blau 20, gelb 15, grün 10 kg). */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E4E9F0; --ink:#10151D; --muted:#5A6576; --line:#DCE2EA;
  --accent:#2457E6; --accent-ink:#FFFFFF; --soft:rgba(36,87,230,.12); --shadow:0 1px 2px rgba(16,21,29,.06),0 4px 14px rgba(16,21,29,.05);
  --red:#D33A3A; --blue:#2F6FE0; --yellow:#D9A50E; --green:#2E9B5E;
  --warn-bg:#FFF4D6; --warn-ink:#6B4F00;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0D12; --surface:#141920; --sunk:#1C232D; --ink:#E8ECF2; --muted:#98A3B3; --line:#262E39;
  --accent:#7A9DFF; --accent-ink:#0A1024; --soft:rgba(122,157,255,.16); --shadow:0 1px 2px rgba(0,0,0,.4);
  --red:#F06464; --blue:#5C93FF; --yellow:#F2C230; --green:#4CC285;
  --warn-bg:#3A2F0E; --warn-ink:#F5DC8E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0D12; --surface:#141920; --sunk:#1C232D; --ink:#E8ECF2; --muted:#98A3B3; --line:#262E39;
  --accent:#7A9DFF; --accent-ink:#0A1024; --soft:rgba(122,157,255,.16); --shadow:0 1px 2px rgba(0,0,0,.4);
  --red:#F06464; --blue:#5C93FF; --yellow:#F2C230; --green:#4CC285;
  --warn-bg:#3A2F0E; --warn-ink:#F5DC8E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:2.4rem;letter-spacing:.01em;line-height:1;margin:0;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-size:1rem;margin:0;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.sync{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:99px;white-space:nowrap}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;margin:18px 0 20px;border-bottom:2px solid var(--line);scrollbar-width:none}
nav.tabs button{font:600 .95rem var(--f-body);background:none;border:0;color:var(--muted);padding:10px 12px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:6px;padding:10px 12px;font-size:.88rem}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.c-red{background:var(--red)}.c-blue{background:var(--blue)}.c-yellow{background:var(--yellow)}.c-green{background:var(--green)}
/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding-bottom:2px}
.day{min-height:62px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 5px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;min-width:0}
.day.out{opacity:.4}
.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day.sel{background:var(--sunk)}
.day .n{font:500 .8rem var(--f-mono)}
.day .bar{height:5px;border-radius:3px;width:100%}
.day .lbl{font-size:.66rem;line-height:1.15;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .chk{position:absolute;top:3px;right:5px;font-size:.75rem;color:var(--green);font-weight:700}
.day .xact{position:absolute;bottom:2px;right:5px;font-size:.8rem;color:var(--green);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
/* Übungszeilen */
.exlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.exlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}
.exlist li:first-child{border-top:0}
.exlist .presc{font:500 .85rem var(--f-mono);text-align:right;white-space:nowrap}
.exlist .meta{grid-column:1/-1;font-size:.8rem;color:var(--muted)}
a{color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;text-align:left;font-weight:600}
/* Formulare */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
label.f select,label.f input{font-weight:400;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.wdpick{display:flex;gap:6px;flex-wrap:wrap}
.wdpick label{display:inline-flex;align-items:center;justify-content:center;width:42px;height:38px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:600;font-size:.85rem;background:var(--surface)}
.wdpick input{position:absolute;opacity:0;pointer-events:none}
.wdpick label:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bodymap{width:100%;max-width:340px;display:block;margin:0 auto}
.bodymap .mbase{fill:var(--sunk)}
.bodymap .mreg{fill:var(--line);stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.bodymap .mreg.some{fill:color-mix(in srgb,var(--accent) 14%,var(--line))}
.bodymap .mreg.has{fill:color-mix(in srgb,var(--accent) 50%,var(--line))}
.bodymap .mreg:hover{fill:color-mix(in srgb,var(--accent) 60%,var(--line))}
.bodymap .mreg.on{fill:var(--accent)}
.bodymap .mreg:focus-visible{outline:none;stroke:var(--ink);stroke-width:2}
.bodymap .mline{fill:none;stroke:var(--surface);stroke-width:1;pointer-events:none;opacity:.7}
.bodymap text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pickex{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.pickex.in{opacity:.55;cursor:default}
.pickex:not(.in):hover{border-color:var(--accent)}
.hasinfo{display:flex;align-items:center;flex-wrap:wrap;column-gap:8px}
.infobtn{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;margin:-4px 0;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;padding:0;opacity:.75}
.infobtn svg{width:17px;height:17px;display:block}
.infobtn:hover{opacity:1}
.infobtn[aria-expanded="true"]{color:var(--accent);opacity:1;background:var(--sunk)}
p.hint{animation:hintin .15s ease-out}
p.hint[hidden]{display:none!important}
@keyframes hintin{from{opacity:0;transform:translateY(-3px)}}
.sugbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.wdpick.wide label{width:auto;padding:0 12px}
.wdpick label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* Supplements */
.grade{font:700 .9rem var(--f-display);letter-spacing:.04em;padding:2px 8px;border-radius:4px;color:#fff}
.g-A{background:var(--green)}.g-B{background:var(--blue)}.g-C{background:var(--yellow);color:#1b1500}.g-D{background:var(--red)}
.supp{display:flex;flex-direction:column;gap:8px}
.supp dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:.88rem}
.supp dt{color:var(--muted)}
.supp dd{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ex-card{display:flex;flex-direction:column;gap:8px}
.ex-card ol,.ex-card ul{margin:0;padding-left:20px;font-size:.88rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bpm{font:700 3.4rem var(--f-display);line-height:1}
.zonebar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.sources{font-size:.8rem;color:var(--muted)}
.sources a{word-break:break-word}
.checkline{display:flex;align-items:baseline;gap:8px;font-size:.9rem;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.panel .tile{background:var(--bg)}
.tl{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tv{font:700 1.9rem var(--f-display);line-height:1.1}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:4px}
.bigtimer{font:700 4.5rem var(--f-display);line-height:1}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.badge.off{color:var(--muted);opacity:.6}
.fwrap{position:relative;display:flex;flex-direction:column}
#chatin{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.chatlog{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.msg{padding:8px 10px;border-radius:12px;font-size:14px;line-height:1.4;max-width:88%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.tr{align-self:flex-start;background:var(--soft)}
.coachtip{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.holdbtn{margin-left:6px;min-width:40px;height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.holdbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.macros{display:grid;gap:10px}
.macro{display:flex;gap:10px;align-items:center}
.macro>i{width:10px;height:10px;border-radius:50%;flex:none}
.nova{display:inline-flex;align-items:center;justify-content:center;min-width:64px;padding:4px 10px;border-radius:8px;font-weight:700;font-size:.85rem;color:#fff}
.nova1{background:#038141}.nova2{background:#85bb2f;color:#1a1a1a}.nova3{background:#ee8100}.nova4{background:#e63e11}
.fsug{position:absolute;top:100%;left:0;right:0;z-index:30;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:320px;overflow:auto}
.fsug button{display:flex;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.fsug button:last-child{border-bottom:0}
.fsug button:hover{background:var(--sunk)}
.fsug .mono{white-space:nowrap;font-size:.8rem}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.chip:hover{border-color:var(--accent)}
.chartwrap{overflow-x:auto}
.chartwrap svg{width:100%;min-width:320px;height:auto;display:block}
.chartwrap .grid{stroke:var(--line);stroke-width:1}
.chartwrap .axis{fill:var(--muted);font:500 15px var(--f-mono)}
.chartwrap .mark{fill:var(--accent)}
.chartwrap .bar:hover .mark{opacity:.75}
.chartwrap .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.chartwrap .dotm{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.btn.big{padding:12px 16px;font-size:1rem}
.plates{display:flex;align-items:center;gap:2px;min-height:64px;overflow-x:auto}
.sleeve{width:26px;height:10px;background:var(--muted);border-radius:2px 0 0 2px;flex:none}
.sleeve.end{width:10px;border-radius:0 2px 2px 0}
.plate{width:20px;flex:none;border-radius:3px;display:flex;align-items:center;justify-content:center;font:600 10px var(--f-mono);writing-mode:vertical-rl;color:#fff}
.p25{background:var(--red)}.p20{background:var(--blue)}.p15{background:var(--yellow);color:#1b1500}.p10{background:var(--green)}
.p5{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}.p2_5{background:var(--ink);color:var(--bg)}.p1_25{background:var(--muted);color:var(--bg)}
.warm{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.warm summary{cursor:pointer}
.warm ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mrows{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:.85rem}
.mrow .mono{text-align:right}
.mtrack{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.mband{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--green) 25%,transparent)}
.mbar{position:absolute;left:0;top:3px;bottom:3px;background:var(--accent);border-radius:0 4px 4px 0}
.mplan{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink)}
.mlegend{display:flex;gap:14px;flex-wrap:wrap}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.lg-bar{width:14px;height:8px;background:var(--accent);border-radius:2px;display:inline-block}
.lg-plan{width:2px;height:12px;background:var(--ink);display:inline-block}
.lg-band{width:14px;height:10px;background:color-mix(in srgb,var(--green) 25%,transparent);display:inline-block}
.edlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.edlist li{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.edlist select,select[data-pe="add"]{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
.edctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.stepper button{background:none;border:0;width:32px;height:32px;cursor:pointer;font-size:1.1rem;color:var(--ink)}
.stepper .mono{min-width:22px;text-align:center}
.icon{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--ink)}
.icon:disabled{opacity:.35;cursor:default}
.btn.small{padding:4px 10px;font-size:.8rem}
.spot{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.9rem;color:var(--green);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:6px 12px;background:var(--surface)}
.spot:hover{border-color:var(--green)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prod h3{margin-top:2px}
.rec{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.rec .grade{font-size:.75rem;padding:1px 6px;vertical-align:1px}
.rec-nein{opacity:.75}
.ex-card.blocked{opacity:.7}
.chip.off-on{background:var(--sunk);color:var(--red);border-color:var(--red)}

/* ---------- Design 2: kompakt, App-Navigation unten auf dem Handy ---------- */
body{font-size:14px}
.wrap{padding-block:12px 40px}
header.top{align-items:center;flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;flex:none;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.logo svg{width:22px;height:22px}
h1{font-size:1.55rem;letter-spacing:.02em}
.sub{font-size:.8rem;margin-top:1px}
h2{font-size:1.3rem}
h3{font-size:.95rem}
.hdr-actions{display:flex;align-items:center;gap:8px;flex:none}
.sync{font-size:.68rem;padding:2px 8px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px}
nav.tabs{margin:12px 0 14px;padding:4px;gap:2px;border:0;border-radius:12px;background:var(--sunk)}
nav.tabs button{border:0;margin:0;padding:7px 12px;border-radius:9px;font-size:.88rem}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.panel{border-radius:14px;padding:14px;border-color:var(--line);box-shadow:var(--shadow)}
.stack{gap:12px}
.grid2{gap:12px}

function altCands(id,used){

function buildSession(key,p,deload){
  const t=T[key], G=GOALS[p.goal], li=LVL_I[p.level];

    const role=x.role;
    if(role==="cardio"){out.push({id:x.id,role,txt:x.dur});continue}
    // Rumpfübung erst ab 75 Minuten, zählt nicht zum Übungslimit
    if(!tmpl&&(role==="core"?p.len<75:strength>=cap)) continue;
    let id=tmpl?x.id:resolveEx(x.id,p.equip); if(!tmpl&&!id&&EX[x.id]) id=altFor(x.id,used); if(!id||!EX[id]) continue;
    const ss=tmpl&&x.ss?{ss:true}:{};

    else if(!tmpl&&role==="acc"){const fv=favFor(id,used); if(fv) id=fv}
    if(!tmpl&&used.has(id)){id=altFor(id,used); if(!id) continue}
    used.add(id);
    if(role!=="core") strength++;
    const half=n=>deload?Math.max(1,Math.ceil(n/2)):n;
    if(role==="core"){out.push({id,role,sets:x.sets?half(x.sets):(deload?2:3),reps:x.reps||String(EX[id].r||"30–60 s").replace(/^\d+\s*×\s*/,""),rir:"",rest:"60 s",...ss});continue}

    const base=x.sets||(role==="acc"&&p.len>=75?Math.min(4,pr.s[li]+1):pr.s[li]);
    const br=state.coach&&state.coach.block&&state.coach.block[role==="main"?"main":"acc"];

  }

  return {key,name:t.n,c:t.c,items:out,deload};
}

// Verschobene Einheiten: state.moves[ursprünglicher Tag] = neuer Tag
function srcOf(d){const M=state.moves||{}; for(const k in M) if(M[k]===d) return k; return M[d]?null:d}
function sessionFor(dateIso){
  const src=srcOf(dateIso); if(!src) return null;
  const s=planFor(src); if(s&&src!==dateIso) s.from=src; return s;
}
function moveSession(from,to){
  const M=state.moves=state.moves||{};
  const a=srcOf(from); if(!a||from===to||!planFor(a)||state.done[from]||state.done[to]) return false;
  const b=srcOf(to);
  M[a]=to; if(b&&planFor(b)) M[b]=from;
  for(const k of Object.keys(M)) if(M[k]===k) delete M[k];
  return true;
}
function unmoveSession(d){

function planFor(dateIso){
  const p=state.profile, d=parseIso(dateIso), start=parseIso(p.start);

  let count=0;

  // Sommerzeit-sicher: count über Kalendertage

  // rot verschiebt die Reihenfolge (z. B. mit Unterkörper statt Oberkörper beginnen)
  const L=sp.seq.length, s=buildSession(sp.seq[(((count+(p.rot||0))%L)+L)%L],p,deload);
  s.week=week+1; return adjustDay(s,dateIso);

/* Verlauf pro Übung: geschätztes 1RM und schwerster Satz je Einheit */
function exHist(id){
  const out=[];
  for(const [d,x] of history()){
    const a=work(x&&x.sets&&x.sets[id]).filter(s=>s&&s.min==null); if(!a.length) continue;
    const top=a.reduce((b,s)=>(s.w>b.w||(s.w===b.w&&(s.r||0)>(b.r||0)))?s:b,a[0]);
    out.push({d,e:Math.max(0,...a.map(setE1)),w:top.w||0,tr:top.r||0,r:Math.max(...a.map(s=>s.r||0)),sets:a});
  }
  return out;
}
function exChart(pts){
  const useW=pts.some(p=>p.w>0);
  const S=(useW?[{k:"e",n:"1RM geschätzt",c:"line",m:"dotm"},{k:"w",n:"Schwerster Satz",c:"line2",m:"dotm2"}]:[{k:"r",n:"Meiste Wiederholungen",c:"line",m:"dotm"}]).filter(s=>pts.some(p=>p[s.k]>0));
  const unit=useW?"kg":"Wdh.";
  if(pts.length<2||!S.length) return `<p class="small muted" style="margin:0">Ab zwei Einheiten erscheint hier eine Kurve.</p>`;
  const vals=S.flatMap(s=>pts.map(p=>p[s.k]).filter(v=>v>0));
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=Math.max(1,(hi-lo)*.12); lo=Math.max(0,Math.floor(lo-pad)); hi=Math.ceil(hi+pad);
  const W=560,H=180,pl=56,pb=24,pt=10, n=pts.length;
  const t0=parseIso(pts[0].d).getTime(), t1=parseIso(pts[n-1].d).getTime();
  const x=d=>pl+(W-pl-14)*((parseIso(d).getTime()-t0)/Math.max(1,t1-t0)), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const dd=d=>d.slice(5).split("-").reverse().join(".");
  const tip=p=>`${dd(p.d)}: ${useW?`${p.e?`1RM ${fmt(p.e,1)} kg · `:""}schwerster Satz ${fmt(p.w,1)} kg × ${p.tr}`:`${p.r} Wdh.`}`;
  return `${S.length>1?`<div class="mlegend small muted">${S.map(s=>`<span><i class="lg-${s.c}"></i>${s.n}</span>`).join("")}</div>`:`<div class="small muted">${S[0].n}</div>`}
  <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf: ${S.map(s=>s.n).join(" und ")}">
    ${[lo,(lo+hi)/2,hi].map(t=>`<line x1="${pl}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" class="axis">${fmt(t)}</text>`).join("")}
    <text x="${pl}" y="${H-6}" class="axis">${dd(pts[0].d)}</text><text x="${W-14}" y="${H-6}" text-anchor="end" class="axis">${dd(pts[n-1].d)}</text>
    ${S.map(s=>{const q=pts.filter(p=>p[s.k]>0); return `<path d="${q.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p[s.k]).toFixed(1)}`).join(" ")}" class="${s.c}"/>
      ${q.map((p,i)=>`<circle cx="${x(p.d).toFixed(1)}" cy="${y(p[s.k]).toFixed(1)}" r="${i===q.length-1?5:4}" class="${s.m}"/>`).join("")}`}).join("")}
    ${pts.map((p,i)=>{const cx=x(p.d), half=(W-pl)/Math.max(2,n)/2; return `<rect class="hit" x="${(cx-half).toFixed(1)}" y="${pt}" width="${(2*half).toFixed(1)}" height="${H-pt-pb}" fill="transparent" rx="4"><title>${tip(p)}</title></rect>`}).join("")}
  </svg></div>`;
}
function exHistHtml(id){
  if(EX[id].cardio) return "";
  const h=exHist(id); if(!h.length) return "";
  const best=h.reduce((b,p)=>p.e>b.e?p:b,h[0]);
  return `<details class="exhist"${ui.histOpen===id?" open":""}><summary><b>Verlauf</b> · ${h.length} ${h.length===1?"Einheit":"Einheiten"}${best.e?` · bestes 1RM ${fmt(best.e,1)} kg`:""}</summary>
    <div class="stack" style="gap:6px">${exChart(h.slice(-24))}
    <div class="small muted">${h.slice(-3).reverse().map(p=>`${p.d.split("-").reverse().join(".")}: <span class="mono">${p.sets.map(setTxt).join(" · ")}</span>`).join("<br>")}</div></div></details>`;

function hrZones(p){

  return {max,z:bands.map(([a,b,n,d])=>({n,d,lo:Math.round(rest+a*hrr),hi:Math.round(rest+b*hrr)}))};
}

function warmups(w,id){

  const scheme=state.profile.goal==="kraft"?[[.4,5],[.6,3],[.8,2],[.9,1]]:[[.5,8],[.7,4],[.85,2]];
  let list=scheme.map(([f,r])=>({w:Math.round(w*f/step)*step,r}));
  if(bb) list=[{w:bar,r:10},...list.filter(x=>x.w>bar)];
  return list.filter((x,i,a)=>x.w<w&&(i===0||x.w>a[i-1].w));
}

function planEdit(op,k,i,val){
  if(op==="pick"){ui.pick=k; ui.pickMus=null; render(); return}
  if(op==="pickclose"){ui.pick=null; render(); return}
  const L=materialize(k);
  if(op==="reset"){delete state.custom[k]}
  else if(op==="up"&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]]}
  else if(op==="down"&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]]}
  else if(op==="del"){L.splice(i,1)}
  else if(op==="sminus"){L[i].sets=Math.max(1,(L[i].sets||3)-1)}
  else if(op==="splus"){L[i].sets=Math.min(10,(L[i].sets||3)+1)}
  else if(op==="reps"){L[i].reps=val}
  else if(op==="swap"&&EX[val]){L[i].id=val; if(EX[val].r) L[i].reps=EX[val].r}
  else if(op==="ss"){L[i].ss=!L[i].ss; if(L[i].ss&&L[i+1]) delete L[i+1].ss}
  else if(op==="add"&&EX[val]){L.push(EX[val].cardio?{id:val,role:"cardio",dur:"20–30 min"}:{id:val,role:["plank","deadbug"].includes(val)?"core":"acc",sets:3,reps:EX[val].r||"10–15"})}
  // Supersätze nur als Paare zweier Kraftübungen
  if(state.custom[k]) state.custom[k].forEach((x,j,A)=>{if(x.ss&&(x.role==="cardio"||!A[j+1]||A[j+1].role==="cardio"||(j>0&&A[j-1].ss))) delete x.ss});
  save(); render();
}

const CAT_SUPP={kreatin:"kreatin",protein:"protein",koffein:"koffein",betaalanin:"betaalanin",vitd:"vitd",omega3:"omega3"};
function allProducts(){return PRODUCTS.concat((state.customProducts||[]).map(x=>({...x,custom:true})))}
const prodById=id=>allProducts().find(x=>x.id===id);
const norm=t=>String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function matchProducts(q){
  const words=norm(q).split(" ").filter(w=>w.length>1); if(!words.length) return [];
  return allProducts().map(pr=>{const hay=norm(pr.brand+" "+pr.name+" "+CAT_N[pr.cat]+" "+(pr.alias||""));
    const hit=words.filter(w=>hay.includes(w)).length; return {pr,score:hit/words.length}})
    .filter(x=>x.score>=.5).sort((a,b)=>b.score-a.score).slice(0,8).map(x=>x.pr);
}
function amtTxt(pr){return `${fmtP(pr.amount)} ${pr.unit}${pr.unit==="µg"&&pr.cat==="vitd"?` (${fmtP(pr.amount*40)} IE)`:""}`}
function dosing(pr){
  const p=state.profile, a=pr.amount; if(!(a>0)) return "";
  const per=(lo,hi,unit)=>{const l=lo/a,h=hi/a; const f=n=>fmtP(Math.round(n*2)/2); return `Für ${fmtP(lo)}–${fmtP(hi)} ${unit} pro Tag: ${f(l)===f(h)?f(l):f(l)+"–"+f(h)} Portion${h>1?"en":""}.`};
  if(pr.cat==="kreatin") return per(3,5,"g Kreatin");
  if(pr.cat==="betaalanin") return per(3.2,6.4,"g Beta-Alanin");
  if(pr.cat==="omega3") return per(1000,2000,"mg EPA+DHA");
  if(pr.cat==="koffein"){const lo=Math.round(p.weight*3),hi=Math.round(p.weight*6); return `${per(lo,hi,"mg Koffein vor dem Training")} Insgesamt nicht über 400 mg pro Tag aus allen Quellen (Kaffee, Energy-Drinks).`}
  if(pr.cat==="protein"){const T=targets(p); return `Eine Portion deckt ${Math.round(a/T.prot*100)} % deines Tagesziels von ${T.prot} g Protein.`}
  if(pr.cat==="eaa") return "Bei ausreichender Proteinzufuhr ist kein Zusatznutzen belegt (siehe BCAA/EAA unten). Erscheint deshalb nicht in der Abhakliste.";
  if(pr.cat==="vitd") return `Nur bei nachgewiesenem Mangel. Obergrenze für Erwachsene: 100 µg (4000 IE) pro Tag aus allen Quellen.`;
  return "";
}

}

/* ---------- Supplement-Empfehlung aus Training und Ernährung ---------- */
const SQ_DEF={fish:"selten",diet:"misch",coffee:2,vitd:"unbekannt",time:"abends"};
function planStats(){
  const st={kraft:0,int:0,z2:0,days:0};
  for(let i=0;i<14;i++){const k=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()+i)); const s=sessionFor(k); if(!s) continue; st.days++;
    for(const it of s.items){if(it.id==="intervals") st.int++; else if(it.id==="z2") st.z2++;}
    if(s.items.some(it=>it.role!=="cardio")) st.kraft++;}
  return st;
}
function foodStats(){
  let n=0,k=0,p=0;
  for(let i=0;i<7;i++){const d=iso(new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()-i)); const l=state.food[d]; if(!l||!l.length) continue; n++; k+=l.reduce((a,x)=>a+x.k,0); p+=l.reduce((a,x)=>a+x.p,0)}
  return n?{n,kcal:Math.round(k/n),prot:Math.round(p/n)}:{n:0};
}
function pickProduct(cat){
  const mine=(state.myProducts||[]).map(prodById).filter(pr=>pr&&pr.cat===cat);
  if(mine.length) return mine[0];
  return allProducts().find(pr=>pr.cat===cat&&pr.brand==="ESN"&&pr.sure!==false)||allProducts().find(pr=>pr.cat===cat);
}
function recs(){
  const p=state.profile, q=Object.assign({},SQ_DEF,state.sq||{}), T=targets(p), ps=planStats(), fs=foodStats();
  const R=[], add=(id,level,why,extra)=>R.push({id,level,why,extra});
  const veg=q.diet!=="misch", month=TODAY.getMonth(), winter=month>=9||month<=2;
  // Kreatin
  if(ps.kraft>0&&p.goal!=="ausd") add("kreatin","emp",[`${ps.kraft} Krafteinheiten in den nächsten 2 Wochen. Kreatin steigert Kraft und Muskelzuwachs nachweislich.`].concat(veg?["Wer wenig oder kein Fleisch isst, hat kleinere Kreatinspeicher und profitiert meist stärker."]:[]));
  else if(ps.kraft>0) add("kreatin","opt",["Hilft bei Intervallen und Krafteinheiten. Die 1–2 kg Wassereinlagerung können beim Laufen stören."]);
  else add("kreatin","nein",["Dein Plan enthält kein Krafttraining."]);
  // Protein
  if(fs.n>=3){const gap=T.prot-fs.prot, pr=pickProduct("protein"), serv=pr?Math.ceil(gap/pr.amount):0;
    if(gap>20) add("protein","emp",[`Du kommst laut Ernährungstagebuch im Schnitt auf ${fs.prot} g Protein pro Tag, dein Ziel sind ${T.prot} g. Es fehlen etwa ${gap} g.`],pr?`${pr.brand} ${pr.name}: ${serv} Portion${serv>1?"en":""} (${esc(pr.serving)}) pro Tag schließen die Lücke.`:"");
    else if(gap>0) add("protein","opt",[`Im Schnitt ${fs.prot} g von ${T.prot} g. Die kleine Lücke schaffst du auch mit Quark, Skyr oder Eiern.`]);
    else add("protein","nein",[`Du erreichst dein Ziel von ${T.prot} g schon mit dem Essen (im Schnitt ${fs.prot} g).`]);
  } else add("protein","opt",[`Dein Ziel sind ${T.prot} g pro Tag. Trage an mindestens 3 Tagen dein Essen ein, dann rechnet die App aus, ob du Pulver brauchst.`]);
  // Koffein
  const cafMg=q.coffee*80, lo=Math.round(p.weight*3);
  if(q.time==="abends") add("koffein","nein",["Du trainierst abends. Koffein verschlechtert dann den Schlaf, und das kostet mehr Erholung, als es Leistung bringt."]);
  else if(ps.int>0||p.goal==="kraft") add("koffein","opt",[`Bringt bei harten Einheiten messbar mehr Leistung (ab ${lo} mg).`].concat(cafMg>=lo?[`Mit ${q.coffee} Tassen Kaffee kommst du schon auf etwa ${cafMg} mg. Eine Tasse direkt vor dem Training reicht meist.`]:[]));
  else add("koffein","opt",["Wirkt, ist aber kein Muss. Ein Kaffee vor dem Training tut es auch."].concat(cafMg>=lo?[`Du trinkst bereits etwa ${cafMg} mg Koffein pro Tag.`]:[]));
  // Beta-Alanin, Nitrat
  if(ps.int>0) add("betaalanin","opt",[`${ps.int} Intervalleinheiten in 2 Wochen. Beta-Alanin hilft bei Belastungen von 1–4 Minuten.`]);
  else add("betaalanin","nein",["Hilft vor allem bei Intervallen von 1–4 Minuten, die dein Plan nicht enthält."]);
  if(ps.int+ps.z2>0) add("nitrat","opt",[`${ps.int+ps.z2} Ausdauereinheiten in 2 Wochen. Rote-Bete-Saft verbessert die Ausdauer etwas.`]);
  else add("nitrat","nein",["Wirkt vor allem bei Ausdauer, die dein Plan kaum enthält."]);
  // Vitamin D
  if(q.vitd==="mangel") add("vitd","emp",["Ein Bluttest hat einen Mangel gezeigt. Dosis nach Absprache mit deiner Ärztin oder deinem Arzt."]);
  else if(q.vitd==="ok") add("vitd","nein",["Dein Blutwert ist in Ordnung."]);
  else add("vitd",winter?"opt":"nein",[winter?"Von Oktober bis März bildet die Haut in der Schweiz kaum Vitamin D. Lass zuerst den Blutwert messen, bevor du hochdosiert nimmst.":"Im Sommer reicht meist die Sonne. Bei Zweifeln den Blutwert messen lassen."]);
  // Omega-3
  if(q.fish==="selten"||q.diet==="vegan") add("omega3","opt",[q.diet==="vegan"?"Ohne Fisch fehlen EPA und DHA. Für Veganer gibt es Algenöl.":"Du isst selten fetten Fisch. Für die Gesundheit sinnvoll, für die Leistung kaum belegt."]);
  else add("omega3","nein",["Du isst regelmäßig Fisch."]);
  add("bcaa","nein",["Bei ausreichend Protein kein Zusatznutzen."]);
  add("testo","nein",["Keine Wirkung belegt, oft verunreinigt."]);
  const notes=[];
  if(q.diet==="vegan") notes.push("Vegan: Vitamin B12 ist Pflicht, das gibt es in pflanzlicher Nahrung nicht. Am besten den Wert beim Arzt prüfen lassen.");
  if(fs.n>=3&&p.goal==="hyper"&&fs.kcal<T.kcal-300) notes.push(`Du isst im Schnitt ${fmt(fs.kcal)} kcal, dein Ziel für Muskelaufbau sind ${fmt(T.kcal)} kcal. Mehr Essen bringt hier mehr als jedes Supplement.`);
  if(fs.n>=3&&p.goal==="fett"&&fs.kcal>T.kcal+300) notes.push(`Du isst im Schnitt ${fmt(fs.kcal)} kcal, für Fettabbau sind ${fmt(T.kcal)} kcal geplant. Kein Supplement ersetzt das Defizit.`);
  return {R,notes,fs,ps,q};
}

  const prs={}; for(const [d,x] of h) for(const [id,arr] of Object.entries(x.sets||{})) for(const s of arr){const e=setE1(s); if(e>(prs[id]?.e||0)) prs[id]={e,w:s.w,r:s.r,d}}

      ${tile("Einheiten gesamt",h.length)}

      </section>

      </section>
    </div>

      ${(()=>{const bf=bw.filter(x=>x.f); if(!bf.length) return `<p class="small muted" style="margin:0">Mit einer Waage, die an Health Connect überträgt (z. B. Withings), kommen Gewicht und Körperfett automatisch hierher.</p>`;

    </section>

}

function foodSuggest(q){

  return FOOD100.filter(f=>t.every(w=>f.key.includes(w)))
    .sort((a,b)=>(normF(b[0]).startsWith(t[0])-normF(a[0]).startsWith(t[0]))||a[0].length-b[0].length).slice(0,8);
}

function targets(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="w"?-161:5);
  const d=p.weekdays.length, f=d<=2?1.375:d<=5?1.55:1.725;
  const tdee=bmr*f, adj={fett:-400,hyper:250}[p.goal]||0;
  const ca=(state.coach&&state.coach.kcalAdj)||0, kcal=Math.round((tdee+adj+ca)/10)*10, prot=Math.round(p.weight*(p.goal==="fett"?2.0:1.8));
  const fat=Math.round(kcal*.27/9), carbs=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),adj,ca,f,kcal,prot,fat,carbs};
}
function ringHtml(label,val,goal,unit,col){
  const pct=goal>0?Math.min(1,val/goal):0, R=48, C=2*Math.PI*R, rest=goal-val;
  return `<div class="ring"><svg viewBox="0 0 120 120" role="img" aria-label="${label}: ${fmt(val)} von ${fmt(goal)} ${unit}">
    <circle cx="60" cy="60" r="${R}" class="rt" fill="none" stroke-width="12"/>
    <circle cx="60" cy="60" r="${R}" class="rv" stroke="${col}" stroke-width="12" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-pct)).toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="62" text-anchor="middle" class="big">${fmt(val)}</text><text x="60" y="80" text-anchor="middle" class="unit">von ${fmt(goal)} ${unit}</text></svg>
    <b>${label}</b><span class="small muted">${rest>=0?`noch ${fmt(rest)} ${unit}`:`${fmt(-rest)} ${unit} drüber`}</span></div>`;
}
function meter(label,val,goal,unit){

}

/* Makronährstoffe: Kernzahlen sichtbar, Erklärungen hinter dem Info-Symbol */
function macroHtml(T,p){

    ["Protein",4,T.prot,"var(--green)",`Baut Muskeln auf und erhält sie, auch im Kaloriendefizit. Für Muskelaufbau reichen meist 1,6–2,2 g pro kg Körpergewicht; darüber bringt es laut Studien kaum mehr. Am besten auf 3–5 Mahlzeiten mit je etwa 20–40 g verteilen. Gute Quellen: Magerquark, Skyr, Hähnchen, Fisch, Eier, Linsen, Tofu.`],
    ["Kohlenhydrate",4,T.carbs,"var(--accent)",`Wichtigster Treibstoff für hartes Krafttraining: Sie füllen die Glykogenspeicher in Muskeln und Leber. Rund ums Training sind sie am nützlichsten. Bevorzugt Haferflocken, Vollkorn, Reis, Kartoffeln, Hülsenfrüchte und Obst; sie liefern auch Ballaststoffe (Ziel etwa 30 g pro Tag).`],
    ["Fett",9,T.fat,"var(--yellow)",`Nötig für Hormone (auch Testosteron) und um die Vitamine A, D, E und K aufzunehmen. Nicht dauerhaft unter etwa 20 % der Kalorien gehen. Bevorzugt Olivenöl, Rapsöl, Nüsse, Samen, Avocado und fetten Fisch wie Lachs (Omega-3).`]];

  </section>`;
}

function scanSupp(x){

  const m=matchProducts((x.brand||"")+" "+(x.name||"")).filter(pr=>b.includes(norm(pr.brand))||norm(pr.brand).includes(b.split(" ")[0]));
  return m[0]||null;
}
window.onBarcode=function(x){

  if(known&&(known.own||x.error)){ui.scan=Object.assign({},known); if(ui.tab!=="ernaehrung") ui.tab="ernaehrung"; render(); return}

function tidyInfo(root){

    if(!h) return;
    const key=(ui.tab+":"+h.textContent.trim()).slice(0,60);
    p.classList.add("hint"); p.dataset.ikey=key; p.hidden=!ui.infoOpen.has(key);
    if(!h.querySelector(".infobtn")){h.classList.add("hasinfo"); h.insertAdjacentHTML("beforeend",`<button class="infobtn" data-info="${esc(key)}" aria-expanded="${ui.infoOpen.has(key)}" aria-label="Erklärung ein- oder ausblenden" title="Erklärung"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg></button>`)}

    const n=p.nextElementSibling;
    if(n&&n.tagName==="P"&&n.querySelector("a[target=_blank]")&&[...n.querySelectorAll("a")].reduce((x,a)=>x+a.textContent.length,0)>=n.textContent.trim().length-6){n.classList.add("hint"); n.dataset.ikey=key; n.hidden=!ui.infoOpen.has(key)}

  const num=(v,lo,hi,d)=>{const n=Number(v); return isFinite(n)&&n>=lo&&n<=hi?n:d};
  // Gewählte nächste Einheit nach dem Neuberechnen beibehalten, wenn die Aufteilung gleich bleibt
  const keepNext=(u=>u&&u.s.key)(upcoming()), oldSeq=splitFor(state.profile).seq.join();
  state.profile={goal:g("goal"),level:g("level"),equip:g("equip"),len:Number(g("len")),
    bar:Number(g("bar"))||20,weight:num(g("weight"),35,250,75),height:num(g("height"),120,230,178),sex:g("sex"),age:num(g("age"),14,100,30),restHr:num(g("restHr"),30,110,60),
    start:g("start")||iso(mondayOf(TODAY)),weekdays:wds,example:false,noGear:Object.keys(GEAR).filter(k=>{const c=document.getElementById("ng-"+k); return c&&c.checked}),split:state.profile.split||"auto",spKraft:g("spKraft").trim().slice(0,300),spCardio:g("spCardio").trim().slice(0,300)};
  const rc=document.getElementById("resetCustom"); if(rc&&rc.checked) state.custom={};
  if(keepNext&&splitFor(state.profile).seq.join()===oldSeq) setNextSession(keepNext);
  save(); ui.sel=todayIso; go("plan");
});

/* ---------- Kalender: Einheiten per Ziehen verschieben (Maus und Touch) ---------- */
let drag=null, suppressClick=false;
function dragEnd(){if(!drag) return; clearTimeout(drag.timer); document.querySelectorAll(".day.lift,.day.droptarget,.day.dropbad").forEach(x=>x.classList.remove("lift","droptarget","dropbad"));
  const g=document.getElementById("dragghost"); if(g) g.remove(); document.body.classList.remove("dragging"); drag=null}
function dragStart(){if(!drag) return; drag.on=true; drag.el.classList.add("lift"); document.body.classList.add("dragging");
  const g=document.createElement("div"); g.id="dragghost"; g.textContent=sessionFor(drag.from).name; document.body.appendChild(g); g.style.left=drag.x+"px"; g.style.top=drag.y+"px";
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}}
function dropTarget(x,y){const el=document.elementFromPoint(x,y); const d=el&&el.closest&&el.closest(".day[data-day]"); return d&&document.getElementById("view").contains(d)?d:null}
const viewEl=document.getElementById("view");
viewEl.addEventListener("pointerdown",e=>{
  const d=e.target.closest(".day[data-drag]"); if(!d||e.button>0) return;
  dragEnd(); drag={from:d.dataset.drag,el:d,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,mouse:e.pointerType==="mouse",on:false};
  if(!drag.mouse) drag.timer=setTimeout(dragStart,320);
});
viewEl.addEventListener("pointermove",e=>{
  if(!drag) return; drag.x=e.clientX; drag.y=e.clientY;
  const moved=Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0);
  if(!drag.on){if(drag.mouse&&moved>6) dragStart(); else if(!drag.mouse&&moved>10){dragEnd(); return} if(!drag.on) return}
  e.preventDefault();
  const g=document.getElementById("dragghost"); if(g){g.style.left=e.clientX+"px"; g.style.top=e.clientY+"px"}
  const t=dropTarget(e.clientX,e.clientY);
  document.querySelectorAll(".day.droptarget,.day.dropbad").forEach(x=>{if(x!==t) x.classList.remove("droptarget","dropbad")});
  if(t&&t!==drag.el) t.classList.add(state.done[t.dataset.day]?"dropbad":"droptarget");
});
viewEl.addEventListener("touchmove",e=>{if(drag&&drag.on) e.preventDefault()},{passive:false});
viewEl.addEventListener("contextmenu",e=>{if(e.target.closest(".day")) e.preventDefault()});
viewEl.addEventListener("pointerup",e=>{
  if(!drag) return; const was=drag.on, from=drag.from, t=was?dropTarget(e.clientX,e.clientY):null; dragEnd();
  if(!was) return; suppressClick=true; setTimeout(()=>{suppressClick=false},80);
  if(t&&t.dataset.day!==from&&moveSession(from,t.dataset.day)){ui.sel=t.dataset.day; save()} render();
});
viewEl.addEventListener("pointercancel",()=>dragEnd());
viewEl.addEventListener("click",e=>{if(suppressClick){suppressClick=false; e.stopPropagation(); e.preventDefault()}},true);

/* ---------- Bluetooth-Herzfrequenz ---------- */
let hrOn=false;
const HAS_BT=()=>!!(NATIVE&&NATIVE.connectHr)||!!navigator.bluetooth;
// Pulswerte aus Handy-App (nativ) oder Web Bluetooth: Anzeige aktualisieren und im laufenden Training mitschreiben
window.onNativeHr=function(bpm){
  liveHr=bpm>0?bpm:null;
  const b=document.getElementById("bpm"), z=document.getElementById("bpmzone"), h=document.getElementById("rt-hr");
  if(b) b.textContent=liveHr||"–"; if(z) z.textContent=liveHr?zoneOf(liveHr,hrZones(state.profile)):"Kein Sensor verbunden"; if(h) h.textContent="♥ "+(liveHr||"–");
  const r=ui.run; if(r&&!r.edit&&liveHr){r.hr=r.hr||{n:0,sum:0,max:0}; r.hr.n++; r.hr.sum+=liveHr; r.hr.max=Math.max(r.hr.max,liveHr)}
};
window.onNativeHrStatus=function(t,ok){
  btStatus=t; const was=hrOn; hrOn=!!ok; const st=document.getElementById("btstatus"); if(st) st.textContent=t;
  if(was!==hrOn&&(ui.tab==="wear"||ui.tab==="training")) keepScroll(render);
};
async function connectBt(){
  const st=document.getElementById("btstatus")||{};
  if(NATIVE&&NATIVE.connectHr){if(hrOn){NATIVE.disconnectHr(); return} st.textContent="Suche Brustgurt …"; NATIVE.connectHr(); return}
  if(!navigator.bluetooth){btStatus="Bluetooth ist hier nicht verfügbar. Öffne die App eigenständig in Chrome oder Edge."; st.textContent=btStatus; return}
  try{
    st.textContent="Suche Sensor …";
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:["heart_rate"]}]});
    const srv=await dev.gatt.connect();
    const ch=await (await srv.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
    await ch.startNotifications();
    window.onNativeHrStatus(`Verbunden mit ${dev.name||"Sensor"}`,true);
    ch.addEventListener("characteristicvaluechanged",ev=>{
      const v=ev.target.value, flags=v.getUint8(0);
      window.onNativeHr((flags&1)?v.getUint16(1,true):v.getUint8(1));
    });
    dev.addEventListener("gattserverdisconnected",()=>{window.onNativeHr(0); window.onNativeHrStatus("Verbindung getrennt",false)});
  }catch(err){btStatus=err&&err.name==="NotFoundError"?"Kein Sensor ausgewählt.":"Verbindung nicht möglich: "+(err&&err.message||err)+". In dieser Ansicht blockiert der Browser Bluetooth möglicherweise."; st.textContent=btStatus}
}

/* ---------- TCX/GPX-Import ---------- */
function importActivity(file){
  const msg=document.getElementById("actmsg");
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const doc=new DOMParser().parseFromString(rd.result,"application/xml");
      if(doc.getElementsByTagName("parsererror").length) throw new Error("Die Datei ist kein gültiges XML.");
      const isTcx=/\.tcx$/i.test(file.name)||doc.getElementsByTagNameNS("*","Trackpoint").length>0;
      let pts=[];
      if(isTcx){
        for(const tp of doc.getElementsByTagNameNS("*","Trackpoint")){
          const t=tp.getElementsByTagNameNS("*","Time")[0]; const hb=tp.getElementsByTagNameNS("*","HeartRateBpm")[0];
          const hr=hb?Number(hb.getElementsByTagNameNS("*","Value")[0]?.textContent):null;
          if(t) pts.push({t:Date.parse(t.textContent),hr});
        }
      }else{
        for(const tp of doc.getElementsByTagNameNS("*","trkpt")){
          const t=tp.getElementsByTagNameNS("*","time")[0]; const hr=tp.getElementsByTagNameNS("*","hr")[0];
          if(t) pts.push({t:Date.parse(t.textContent),hr:hr?Number(hr.textContent):null});
        }
      }
      pts=pts.filter(p=>isFinite(p.t));
      if(pts.length<2) throw new Error("Keine Zeitpunkte in der Datei gefunden.");
      const dur=Math.round((pts[pts.length-1].t-pts[0].t)/60000);
      const hrs=pts.map(p=>p.hr).filter(h=>h>30&&h<240);
      const Z=hrZones(state.profile);
      let zones=null, avg=null, max=null;
      if(hrs.length){
        avg=Math.round(hrs.reduce((a,b)=>a+b,0)/hrs.length); max=Math.max(...hrs);
        const c=[0,0,0,0,0]; hrs.forEach(h=>{let i=Z.z.findIndex(z=>h<=z.hi); if(i<0) i=4; c[i]++});
        zones=c.map(n=>Math.round(n/hrs.length*100));
      }
      const date=iso(new Date(pts[0].t));
      state.acts.push({date,dur,avg,max,zones,src:file.name.slice(0,60)});
      save(); render();
      document.getElementById("actmsg").textContent=`Importiert: ${date}, ${dur} min${avg?`, Ø ${avg} bpm`:" (ohne Puls)"}.`;
    }catch(err){msg.textContent="Import fehlgeschlagen: "+err.message}
  };
  rd.onerror=()=>{msg.textContent="Die Datei konnte nicht gelesen werden."};
  rd.readAsText(file);
}

let themePref="system"; try{themePref=localStorage.getItem(LS_KEY+".theme")||"system"}catch(e){}
const THEME_UI={system:["Design: wie System",'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5z" fill="currentColor"/>'],
  light:["Design: hell",'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>'],
  dark:["Design: dunkel",'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>']};
function applyTheme(){
  const r=document.documentElement;
  if(themePref==="system"){if(HOST_THEME) r.setAttribute("data-theme",HOST_THEME); else r.removeAttribute("data-theme")}
  else r.setAttribute("data-theme",themePref);
  const dark=themePref==="dark"||(themePref==="system"&&(HOST_THEME?HOST_THEME==="dark":matchMedia("(prefers-color-scheme: dark)").matches));
  const b=document.getElementById("themebtn"), [label,path]=THEME_UI[themePref];
  b.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">${path}</svg>`;
  b.setAttribute("aria-label",label+". Tippen zum Wechseln"); b.title=label;
  if(NATIVE&&NATIVE.setTheme){try{NATIVE.setTheme(getComputedStyle(r).getPropertyValue("--bg").trim(),dark)}catch(e){}}
}
document.getElementById("themebtn").addEventListener("click",()=>{
  themePref={system:"light",light:"dark",dark:"system"}[themePref]||"system";
  try{localStorage.setItem(LS_KEY+".theme",themePref)}catch(e){}
  applyTheme();
});
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(themePref==="system") applyTheme()})}catch(e){}
